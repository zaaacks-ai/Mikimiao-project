<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配手机端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灰仔的网站</title>
    <!-- 引入样式文件 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <h1>灰仔的网站</h1>
            <ul>
                <li><a href="#home">首页</a></li>
                <li><a href="#about">关于我</a></li>
                <li><a href="#contact">联系我</a></li>
            </ul>
        </div>
    </nav>

    <!-- 首页内容 -->
    <section id="home" class="hero">
        <div class="container">
            <h2>你好，欢迎来到灰仔的网站！</h2>
            <p>这是我用爪子做的第一个网站 🎉</p>
            <button id="btn">点击我试试</button>
        </div>
    </section>

    <!-- 关于我 -->
    <section id="about" class="about">
        <div class="container">
            <h2>关于我</h2>
            <p>我是一个编程新手，正在学习如何搭建自己的网站。</p>
        </div>
    </section>

    <!-- 联系我 -->
    <section id="contact" class="contact">
        <div class="container">
            <h2>联系我</h2>
            <input type="text" placeholder="灰仔">
            <input type="email" placeholder="huizai@gmail.com">
            <button>发送消息</button>
        </div>
    </section>

    <!-- 引入交互文件 -->
    <script src="script.js"></script>
</body>
</html>
